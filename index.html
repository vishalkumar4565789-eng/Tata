<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Video Call</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .call-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 680px;
            background: #1e293b;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Remote Video Window */
        .main-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000 url('https://via.placeholder.com/400x680/111827/ffffff?text=Video+Feed') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Self Preview Window */
        .self-video {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 140px;
            background: #334155;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 2;
        }

        /* Overlay Details */
        .caller-info {
            position: relative;
            z-index: 2;
            padding: 20px;
            background: linear-gradient(180deg, rgba(15,23,42,0.8) 0%, rgba(15,23,42,0) 100%);
            text-align: left;
        }

        .caller-name {
            font-size: 20px;
            font-weight: bold;
        }

        .call-status {
            font-size: 14px;
            color: #38bdf8;
            margin-top: 4px;
        }

        /* Call Action Controls */
        .controls {
            position: relative;
            z-index: 2;
            padding: 30px 20px;
            background: linear-gradient(0deg, rgba(15,23,42,0.9) 0%, rgba(15,23,42,0) 100%);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .control-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .btn-call-start {
            background-color: #22c55e;
            width: 65px;
            height: 65px;
        }

        .btn-end {
            background-color: #ef4444;
            display: none;
        }

        .active {
            background-color: #ffffff;
            color: #0f172a;
        }
    </style>
</head>
<body>

<div class="call-container">
    <!-- Remote Main Video -->
    <div class="main-video" id="mainVideo"></div>

    <!-- Self Preview -->
    <div class="self-video"></div>

    <!-- Top Info Bar -->
    <div class="caller-info">
        <div class="caller-name">Live Video Call</div>
        <div class="call-status" id="callStatus">Ready to connect...</div>
    </div>

    <!-- Action Buttons -->
    <div class="controls">
        <button class="control-btn" onclick="toggleMute(this)">🎤</button>
        <button class="control-btn btn-call-start" id="startBtn" onclick="startCall()">📞</button>
        <button class="control-btn btn-end" id="endBtn" onclick="endCall()">📵</button>
        <button class="control-btn" onclick="toggleCam(this)">📷</button>
    </div>
</div>

<script>
    let isConnected = false;

    function startCall() {
        const status = document.getElementById('callStatus');
        const startBtn = document.getElementById('startBtn');
        const endBtn = document.getElementById('endBtn');

        status.innerText = "Connecting...";
        
        setTimeout(() => {
            status.innerText = "Connected • 00:01";
            startBtn.style.display = "none";
            endBtn.style.display = "flex";
            isConnected = true;
        }, 1500);
    }

    function endCall() {
        const status = document.getElementById('callStatus');
        const startBtn = document.getElementById('startBtn');
        const endBtn = document.getElementById('endBtn');

        status.innerText = "Call Ended";
        endBtn.style.display = "none";
        startBtn.style.display = "flex";
        
        setTimeout(() => {
            status.innerText = "Ready to connect...";
        }, 2000);
    }

    function toggleMute(btn) {
        btn.classList.toggle('active');
    }

    function toggleCam(btn) {
        btn.classList.toggle('active');
    }
</script>

</body>
</html>
