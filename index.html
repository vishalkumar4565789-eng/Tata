<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call UI Template</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .call-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            background-color: #1e1e1e;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Main Video Screen */
        .main-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #2a2a2a;
        }

        /* Small Self Camera Overlay */
        .user-video {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 160px;
            height: 110px;
            background-color: #333;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Control Buttons Bar */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        .btn-end {
            background-color: #ff4d4d;
        }

        .btn-end:hover {
            background-color: #ff1a1a;
        }
    </style>
</head>
<body>

    <div class="call-container">
        <!-- Remote User Video -->
        <video class="main-video" autoplay playsinline poster="https://via.placeholder.com/800x500?text=Connecting..."></video>

        <!-- Your Own Video Preview -->
        <video class="user-video" autoplay playsinline muted poster="https://via.placeholder.com/160x110?text=You"></video>

        <!-- Call Action Buttons -->
        <div class="controls">
            <button class="btn">Mute</button>
            <button class="btn">Camera Off</button>
            <button class="btn btn-end">End Call</button>
        </div>
    </div>

</body>
</html>
